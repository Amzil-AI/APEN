# APEN Agent MVP – Intent definitions for call qualification
# Order matters: first match wins. callback before info so "rappeler" → callback.
# Intents: appointment, callback, info, emergency, after_sales, partner, other

intents:
  appointment:
    id: appointment
    name: "Prise de rendez-vous / Appointment booking"
    description: "Caller wants to book a slot (e.g. uniform collection, visit)"
    keywords_fr:
      - "rendez-vous"
      - "rdv"
      - "réserver"
      - "créneau"
      - "tenue"
      - "récupérer tenue"
      - "passer"
      - "prendre rdv"
      - "prise de rendez-vous"
      - "prendre un rendez-vous"
      - "je voudrais un rdv"
      - "réserver un créneau"
      - "récupération tenue"
      - "venir chercher"
      - "passer récupérer"
      - "planifier"
      - "disponibilités"
      - "dispo"
    keywords_en:
      - "appointment"
      - "book"
      - "schedule"
      - "slot"
      - "uniform"
      - "pick up"
      - "booking"
      - "make an appointment"
      - "need an appointment"
      - "would like to book"
      - "schedule a visit"
      - "available slot"
      - "availability"
      - "come in"
      - "drop by"
    action: book_appointment
    transfer_default: null

  callback:
    id: callback
    name: "Rappel / Call back"
    description: "Caller asks to be called back or leave a message for callback"
    keywords_fr:
      - "rappel"
      - "rappeler"
      - "être rappelé"
      - "rappelez-moi"
      - "recontact"
      - "recontacter"
      - "rappelez moi"
      - "me rappeler"
      - "pouvez-vous me rappeler"
      - "je souhaite être rappelé"
      - "rappelez-moi s'il vous plaît"
      - "laisser un message"
      - "message de rappel"
      - "qu'on me rappelle"
      - "qu'on me recontacte"
    keywords_en:
      - "call back"
      - "callback"
      - "call me back"
      - "ring back"
      - "call back please"
      - "get back"
      - "please call me back"
      - "would like to be called back"
      - "like to be called back"
      - "leave a message"
      - "call me"
      - "call back when"
      - "someone call me"
      - "get back to me"
      - "call me later"
    action: collect_summary
    transfer_default: reception

  info:
    id: info
    name: "Demande d'information / Information request"
    description: "Caller asks for hours, address, general info"
    keywords_fr:
      - "horaires"
      - "heures"
      - "adresse"
      - "ouvert"
      - "fermé"
      - "info"
      - "renseignement"
      - "où"
      - "quand"
      - "comment"
      - "heures d'ouverture"
      - "joignable"
      - "contacter"
      - "coordonnées"
      - "site"
      - "localisation"
      - "accès"
      - "tarif"
      - "prix"
      - "documentation"
    keywords_en:
      - "hours"
      - "address"
      - "open"
      - "closed"
      - "information"
      - "where"
      - "when"
      - "how"
      - "opening hours"
      - "reach"
      - "contact"
      - "location"
      - "directions"
      - "price"
      - "cost"
      - "info about"
    action: provide_info
    transfer_default: null

  emergency:
    id: emergency
    name: "Urgence opérationnelle / Operational emergency"
    description: "Urgent operational or site issue"
    keywords_fr:
      - "urgence"
      - "urgent"
      - "incident"
      - "problème site"
      - "alerte"
      - "critique"
      - "immédiat"
      - "sécurité"
      - "accident"
    keywords_en:
      - "emergency"
      - "urgent"
      - "incident"
      - "alert"
      - "critical"
      - "asap"
      - "immediately"
      - "safety"
      - "accident"
