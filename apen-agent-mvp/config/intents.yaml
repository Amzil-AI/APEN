      - "proposition"
      - "devis"
      - "commercial"
      - "b2b"
      - "entreprise"
      - "pro"
      - "marché public"
    keywords_en:
      - "partner"
      - "partnership"
      - "quote"
      - "commercial"
      - "b2b"
      - "business"
      - "enterprise"
      - "proposal"
      - "tender"
